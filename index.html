<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>조물조물 · 나만의 찰흙 친구</title>
    <meta name="description" content="찰흙을 빚고, 가마에 굽고, 색칠해서 나만의 3D 친구를 만드는 공방" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" id="brand" href="/" title="첫 화면으로">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path fill="currentColor" d="M16 3.5c4.2 0 6.6 2.6 7.6 5.6 3.6.6 6.4 3.6 6.4 8 0 6.4-5.6 11.4-14 11.4S2 23.5 2 17.1c0-4.4 2.8-7.4 6.4-8C9.4 6.1 11.8 3.5 16 3.5Z"/><circle cx="11.6" cy="17" r="1.7" fill="#fff"/><circle cx="20.4" cy="17" r="1.7" fill="#fff"/><path d="M13.6 21.2c1.4 1.2 3.4 1.2 4.8 0" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span class="brand-name">조물조물</span>
        <span class="brand-sub">나만의 찰흙 친구 만들기</span>
      </a>
    </header>

    <!-- 만드는 중에는 위 바 대신 이 한 줄만: 홈으로 · 단계 · 작품 이름 -->
    <div class="workbar" id="workbar" hidden>
      <div class="workbar-left">
        <button class="home-link" id="home-link" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
          홈으로 돌아가기
        </button>
      </div>
      <ol class="stepper" id="stepper">
        <li data-step="pick"><b>1</b><span>고르기</span></li>
        <li data-step="sculpt"><b>2</b><span>빚기</span></li>
        <li data-step="bake"><b>3</b><span>굽기</span></li>
        <li data-step="paint"><b>4</b><span>색칠</span></li>
        <li data-step="done"><b>5</b><span>완성</span></li>
      </ol>
      <div class="namebox">
        <label for="piece-name">작품 이름</label>
        <input id="piece-name" maxlength="30" placeholder="이름을 지어 주세요" autocomplete="off" spellcheck="false" />
        <button class="name-dice" id="name-dice" type="button" title="다른 이름 뽑기" aria-label="다른 이름 뽑기">🎲</button>
      </div>
    </div>

    <main class="stage" id="stage">
      <canvas id="view"></canvas>

      <div class="hint" id="hint"></div>
      <div class="fps" id="fps" hidden></div>

      <section class="overlay pick" id="pick-overlay">
        <div class="bg-works" id="bg-works" aria-label="모두의 작품"></div>
        <div class="pick-card">
          <h1>어떤 친구를 빚어 볼까요?</h1>

          <form class="ai-card" id="ai-form" autocomplete="off">
            <div class="ai-image" id="ai-image" hidden>
              <img id="ai-image-img" alt="넣은 이미지" />
              <span>이 이미지를 보고 만들어요</span>
              <button class="icon" id="ai-image-clear" type="button" aria-label="이미지 빼기">✕</button>
            </div>
            <div class="ai-box">
              <div class="ai-plus-wrap">
                <button class="ai-plus" id="ai-plus" type="button" aria-label="더하기" aria-haspopup="menu" aria-expanded="false">+</button>
                <div class="ai-menu" id="ai-menu" role="menu" hidden>
                  <button id="ai-attach" type="button" role="menuitem">🖼 이미지 추가</button>
                </div>
              </div>
              <input id="ai-prompt" maxlength="200" placeholder="이미지 첨부 또는 텍스트 입력 (예: 빨간 목도리를 한 눈사람)" aria-label="만들고 싶은 친구" />
            </div>
            <button class="btn primary ai-go" id="ai-go" type="submit">AI와 함께 시작하기</button>
            <input type="file" id="ai-file" accept="image/*" hidden />
            <p class="ai-off" id="ai-off" hidden>지금은 AI 반죽을 쓸 수 없어요. 아래 기본 반죽으로 시작해 보세요!</p>
          </form>

          <div class="divider"><span>또는 기본 반죽 고르기</span></div>
          <div class="base-grid" id="base-grid"></div>
          <div class="pick-foot">
            <label>반죽 세밀함
              <select id="quality">
                <option value="88">보통 (빠름)</option>
                <option value="120" selected>세밀 (권장)</option>
                <option value="156">아주 세밀 (느림)</option>
              </select>
            </label>
            <span class="muted">세밀할수록 색칠 경계가 또렷하지만 조금 느려져요.</span>
          </div>
        </div>
        <input type="file" id="glb-input" accept=".glb,model/gltf-binary" hidden />
        <div class="dropzone" id="dropzone" hidden><div>📦 여기에 놓으면 GLB 모형을 불러와요</div></div>
      </section>

      <section class="overlay bake" id="bake-overlay" hidden>
        <div class="kiln">
          <div class="kiln-fire" id="kiln-fire"></div>
          <h2 id="bake-title">가마에서 굽는 중…</h2>
          <div class="bar"><i id="bake-bar"></i></div>
          <p id="bake-temp">0 ℃</p>
        </div>
      </section>

      <section class="overlay busy" id="busy-overlay" hidden>
        <div class="busy-card"><div class="spinner"></div><p id="busy-text">반죽 준비 중…</p></div>
      </section>

      <aside class="pitch-mini" id="pitch-mini" hidden>
        <button class="pm-close" type="button" aria-label="닫기">✕</button>
        <video src="/pitch/demo.mp4" muted loop playsinline preload="metadata" title="크게 보기"></video>
        <div class="pm-body">
          <b>35초 만에 보는 조물조물</b>
          <span>고르고 · 빚고 · 굽고 · 칠하기</span>
          <div class="pm-row">
            <button class="btn pm-big" type="button">▶ 크게 보기</button>
            <button class="btn pm-deck" type="button">📄 피치덱</button>
          </div>
        </div>
      </aside>

      <div class="toast" id="toast" hidden></div>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
